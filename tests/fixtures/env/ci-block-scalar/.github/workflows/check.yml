name: check
on:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install and test
        run: |
          npm ci
          npm run lint -- --max-warnings=0

          npm test
      - name: Single line
        run: npm run build
      - name: Folded
        run: >-
          node scripts/report.js
          --out report.txt
