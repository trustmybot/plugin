name: release-payload
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-payload
  cancel-in-progress: true

jobs:
  payload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --experimental-strip-types scripts/maintenance/runtime-payload.ts
          git commit -q -m "🔖 chore(payload): $TAG"
          git push --force origin "refs/tags/payload/$TAG"
          node --experimental-strip-types scripts/maintenance/runtime-payload.ts --check
          git push --force origin HEAD:refs/heads/main
