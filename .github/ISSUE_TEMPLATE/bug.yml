name: Bug report
description: TMB did something wrong. You do not need to know how TMB works inside.
labels: ["Bug"]
body:
  - type: markdown
    attributes:
      value: Only the first three questions and one checkbox at the end are required; skip anything else you cannot answer. If you use TMB, you can also ask bro to report the bug for you.
  - type: input
    id: summary
    attributes:
      label: What went wrong
      description: "One sentence, in your own words. Example: TMB blocked a normal git push."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you were trying to do, what you expected, and what happened. Plain words are enough.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How much this stops you from working.
      options:
        - Blocks all TMB work
        - Blocks one task, has a workaround
        - Annoying or cosmetic
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message
      description: Optional. Copy the message you saw, exactly as it appeared.
      render: text
    validations:
      required: false
  - type: dropdown
    id: frequency
    attributes:
      label: How often
      description: Optional. How often it happens when you try the same thing again. Tried it once? Pick Once.
      options:
        - Every time
        - Sometimes
        - Once
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Optional. Your best guess; a maintainer corrects it, so a wrong guess is fine.
        - Hooks: something you did was blocked or denied.
        - Agents: bro, swe or the reviewer did the wrong thing.
        - Trajectory Server: a TMB tool failed or its records are wrong.
        - World Model: TMB did not know your code.
        - Dashboard: the dashboard page.
        - Install: installing, updating or starting TMB.
        - Cheatcode: an outside skill or tool.
        - Adapters: Codex, Cursor or Gemini.
        - Release: TMB's own builds.
      options:
        - Hooks
        - Trajectory Server
        - World Model
        - Dashboard
        - Install
        - Agents
        - Cheatcode
        - Adapters
        - Release
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Optional. What you typed or clicked, in order, as far as you remember. If you do not know how to make it happen again, say so and describe the last thing you did.
      placeholder: |
        1. I asked: "add a login page".
        2. TMB worked for a while, then stopped with a message that starts with BLOCKED.
        3. I asked again and got the same message.
    validations:
      required: false
  - type: textarea
    id: repro-script
    attributes:
      label: Minimal repro script
      description: Optional. Skip this unless you already have a script that makes the bug happen.
      render: shell
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Optional. Your TMB version, your Claude Code version (`claude --version`) and your operating system. A report bro drafted has this filled in already.
      render: text
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Optional. Skip this unless a maintainer asks for it.
      render: text
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Optional. What let you keep working, if anything did.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this error.
          required: false
        - label: I read this report and it contains no secrets, private code or personal paths.
          required: true
        - label: It still happens on the latest version.
          required: false
    validations:
      required: true
