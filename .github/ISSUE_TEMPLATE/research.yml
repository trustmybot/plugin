name: Research
description: A question to look into before anything is built
labels: ["Research"]
body:
  - type: markdown
    attributes:
      value: |
        Plain words are enough. You do not need to know how TMB works inside. Only the first question is required.
  - type: textarea
    id: question
    attributes:
      label: What do we want to find out?
      description: The question, and what its answer would help decide.
      placeholder: |
        Does a second reviewer catch more bugs than one reviewer at higher effort?
        The answer decides whether TMB should offer a second review.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: How could we find out?
      description: Optional. A paper, some data or an experiment you have in mind. Leave it empty if you do not know.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Optional. The part of TMB this is about. Not sure? Leave it empty and a maintainer fills it in.
        - Hooks: something you did was blocked or denied.
        - Agents: bro, swe or the reviewer did the wrong thing.
        - Trajectory Server: a TMB tool, or the records TMB keeps.
        - World Model: what TMB knows about your code, and its search.
        - Dashboard: the dashboard page.
        - Install: installing, updating or starting TMB.
        - Cheatcode: finding or installing an outside skill or tool.
        - Adapters: using TMB with Codex, Cursor or Gemini.
        - Release: TMB's own builds and versions.
      options:
        - Hooks
        - Trajectory Server
        - World Model
        - Dashboard
        - Install
        - Agents
        - Cheatcode
        - Adapters
        - Release
    validations:
      required: false
