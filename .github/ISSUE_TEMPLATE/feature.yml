name: Feature request
description: New functionality for TMB
labels: ["Feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Your best guess at the part of TMB. A maintainer corrects it, so a wrong guess is fine.
        - Hooks: something you did was blocked or denied.
        - Agents: bro, swe or the reviewer did the wrong thing.
        - Trajectory Server: a TMB tool failed, or TMB's records are wrong.
        - World Model: TMB did not know your code, or its search was wrong.
        - Dashboard: the dashboard page.
        - Install: installing, updating or starting TMB.
        - Cheatcode: finding or installing an outside skill or tool.
        - Adapters: using TMB with Codex, Cursor or Gemini.
        - Release: TMB's own builds and versions.
      options:
        - Hooks
        - Trajectory Server
        - World Model
        - Dashboard
        - Install
        - Agents
        - Cheatcode
        - Adapters
        - Release
    validations:
      required: true
