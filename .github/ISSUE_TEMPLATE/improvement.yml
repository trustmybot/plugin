name: Improvement
description: Something TMB already does, but could do better
labels: ["Improvement"]
body:
  - type: markdown
    attributes:
      value: |
        Plain words are enough. You do not need to know how TMB works inside. Only the first question is required.
  - type: textarea
    id: current
    attributes:
      label: What happens today?
      description: What TMB does now, and what is slow, confusing or awkward about it.
      placeholder: |
        After every task TMB asks me the same question about the branch name.
        I answer the same way each time.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would be better?
      description: Optional. How you would like it to work. Leave it empty if you only know what bothers you.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Optional. The part of TMB this is about. Not sure? Leave it empty and a maintainer fills it in.
        - Hooks: something you did was blocked or denied.
        - Agents: bro, swe or the reviewer did the wrong thing.
        - Trajectory Server: a TMB tool, or the records TMB keeps.
        - World Model: what TMB knows about your code, and its search.
        - Dashboard: the dashboard page.
        - Install: installing, updating or starting TMB.
        - Cheatcode: finding or installing an outside skill or tool.
        - Adapters: using TMB with Codex, Cursor or Gemini.
        - Release: TMB's own builds and versions.
      options:
        - Hooks
        - Trajectory Server
        - World Model
        - Dashboard
        - Install
        - Agents
        - Cheatcode
        - Adapters
        - Release
    validations:
      required: false
