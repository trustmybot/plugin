name: pr-check
on:
  # L1 lints and strict tsc (via build:payload) plus the dashboard tests on every PR into dev, rc or main (GH 2064).
  # They also run on merge_group, so dev can use a merge queue (GH 2820).
  # The full L1-L4 sweep runs only in release-gate.yml at rc (GH 2805).
  pull_request:
    branches: [dev, rc, main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  l1:
    name: L1 lints + strict tsc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The world-model equivalence test replays the last first-parent commits.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          (cd dashboard && bun install --frozen-lockfile)

      - name: L1 lints (build:payload runs first)
        run: node --experimental-strip-types tests/run-all.ts --l1-only

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          (cd dashboard && bun install --frozen-lockfile)

      - name: Build
        run: |
          (cd mcp/trajectory-server && bun run build:tsc)
          (cd dashboard && bun run build)

      - name: Dashboard tests
        run: node --test dashboard/test/*.test.mjs
