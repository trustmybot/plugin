name: test

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: lint + MCP unit + integration + hooks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      # Node 22+ required: MCP server uses node:sqlite (stdlib) — added in 22,
      # behind --experimental-sqlite flag on 22.x, stable on 24+. The
      # ubuntu-latest runner ships Node 20 by default, which doesn't have
      # node:sqlite — would fail with ERR_UNKNOWN_BUILTIN_MODULE.
      - name: install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install sqlite3
        run: sudo apt-get install -y sqlite3

      - name: install workspace deps
        run: bun install --frozen-lockfile

      - name: build all workspaces
        run: bun run build

      - name: run full test suite
        run: bash tests/run-all.sh

  install-smoke:
    name: L0 install-smoke (cold-start Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build install-smoke image
        # Strips local artifacts, runs `bun install`, asserts dist/index.js
        # exists, spawns the MCP server, and verifies tools/list responds.
        # This catches the v0.1.2 class of bug where the published artifact
        # was unbootable because postinstall didn't fire.
        run: docker build -f tests/docker/install-smoke.Dockerfile -t tmb-install-smoke .
