name: Auth diagnostic (one-off, delete after #116)

# Ad-hoc workflow to isolate CLAUDE_CODE_OAUTH_TOKEN auth from everything
# else. No plugin, no env, no flags — just `claude -p "say hi"`. If THIS
# fails, the token itself is bad. If this passes, the failure is elsewhere.
#
# Security: only secrets routed via env:. No untrusted PR-injected strings.

on:
  workflow_dispatch:
  # pull_request trigger so we can run this without first merging to main.
  # The workflow runs from the PR's HEAD, so it picks up THIS file's content.
  pull_request:
    paths:
      - '.github/workflows/auth-diagnostic.yml'

jobs:
  auth-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Inspect token (length and shape only — never the value)
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "FAIL: secret is empty"
            exit 1
          fi
          LEN=${#TOKEN}
          echo "secret length: $LEN bytes"
          # Detect trailing newline by comparing to length-stripped version
          STRIPPED=$(printf '%s' "$TOKEN" | tr -d '\n\r\t ')
          STRIPPED_LEN=${#STRIPPED}
          DIFF=$((LEN - STRIPPED_LEN))
          if [ "$DIFF" -gt 0 ]; then
            echo "WARNING: token has $DIFF whitespace/newline character(s) — likely the bug"
          else
            echo "no trailing whitespace detected (length matches stripped length)"
          fi
          # Token format prefix check (sk-ant-oat = OAuth)
          PREFIX=$(printf '%s' "$TOKEN" | head -c 11)
          # GitHub will mask the prefix in output too if it overlaps the secret
          echo "first 11 chars (will be masked): $PREFIX"

      - name: Try basic claude -p with OAuth token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "Calling: claude -p 'say hi in one word'"
          set +e
          OUT=$(claude -p "say hi in one word" 2>&1)
          RC=$?
          set -e
          echo "exit code: $RC"
          echo "--- output (start) ---"
          echo "$OUT"
          echo "--- output (end) ---"
          if [ $RC -eq 0 ] && [ -n "$OUT" ]; then
            echo "AUTH WORKS"
          else
            echo "AUTH FAILED — see output above"
            exit 1
          fi
