name: dev-build
on:
  # Stamps every dev push as X.Y.Z-dev.<n>.gh<PR> and force-pushes the result to
  # the dev-build branch that the dev marketplace channel serves. Not a gate.
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
        description: 'Build and check the payload on any ref without pushing or commenting'

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: ${{ inputs.dry_run && format('dev-build-dry-run-{0}', github.run_id) || 'dev-build' }}
  cancel-in-progress: true

jobs:
  stamp:
    name: Stamp and publish dev build
    if: github.ref == 'refs/heads/dev' || inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build the generated payload
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --ignore-scripts
          (cd dashboard && bun install --frozen-lockfile)
          bun run build:payload
          git add -f mcp/trajectory-server/dist dashboard/dist \
            scripts/hooks/lib/audit-events.txt scripts/hooks/lib/data-contracts.json

      - name: Resolve the next release version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag -l 'v[0-9]*' --sort=-v:refname \
                        | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')"
          LAST_TAG="${LAST_TAG:-v0.0.0}"
          LAST="${LAST_TAG#v}"
          NEXT=""
          while IFS= read -r v; do
            [ "$v" != "$LAST" ] || continue
            [ "$(printf '%s\n%s\n' "$LAST" "$v" | sort -V | tail -1)" = "$v" ] || continue
            if [ -z "$NEXT" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$v" | sort -V | head -1)" = "$v" ]; then
              NEXT="$v"
            fi
          done < <(gh api --paginate "repos/$REPO/milestones?state=open" --jq '.[].title' \
                     | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//')
          if [ -z "$NEXT" ]; then
            IFS=. read -r MAJOR MINOR _ <<< "$LAST"
            NEXT="$MAJOR.$((MINOR + 1)).0"
            echo "No open vX.Y.Z milestone above $LAST_TAG; falling back to $NEXT."
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Resolve the PR that produced this commit
        id: pr
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PR="$(gh api "repos/$REPO/commits/$DEV_SHA/pulls" --jq '.[0].number // empty')"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        id: version
        env:
          NEXT: ${{ steps.next.outputs.next }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          ARGS=(--next "$NEXT")
          [ -z "$PR" ] || ARGS+=(--pr "$PR")
          VERSION="$(node --experimental-strip-types scripts/maintenance/dev-build-version.ts "${ARGS[@]}")"
          node --experimental-strip-types scripts/maintenance/bump-version.ts --version-only "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit the payload
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --experimental-strip-types scripts/maintenance/runtime-payload.ts
          git commit -am "🔖 chore(dev-build): $VERSION" -m "Built from $DEV_SHA."
          node --experimental-strip-types scripts/maintenance/runtime-payload.ts --check

      - name: Check the payload against dev-build
        if: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin +refs/heads/dev-build:refs/remotes/origin/dev-build
          node --experimental-strip-types scripts/maintenance/payload-parity.ts --ref origin/dev-build

      - name: Cold-boot the payload's MCP server
        if: ${{ inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/payload"
          mkdir -p "$PAYLOAD"
          git archive HEAD | tar -x -C "$PAYLOAD"
          test ! -e "$PAYLOAD/node_modules" && test ! -e "$PAYLOAD/mcp/trajectory-server/node_modules"
          status=0
          echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            | TRAJECTORY_DB_PATH=:memory: timeout 30 node --experimental-sqlite "$PAYLOAD/mcp/trajectory-server/dist/index.js" \
              > "$RUNNER_TEMP/cold-mcp.out" 2> "$RUNNER_TEMP/cold-mcp.err" || status=$?
          if ! grep -q '"name":"onboard_state_get"' "$RUNNER_TEMP/cold-mcp.out"; then
            echo "::error::Cold MCP boot of the payload's dist/index.js (exit $status) did not list onboard_state_get."
            cat "$RUNNER_TEMP/cold-mcp.out" "$RUNNER_TEMP/cold-mcp.err"
            exit 1
          fi
          echo "### Dev build dry run \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Payload built, matched dev-build's generated paths and cold-booted; not pushed." >> "$GITHUB_STEP_SUMMARY"

      - name: Push to dev-build
        id: push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/dev-build
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Dev build \`$VERSION\`"
            echo
            echo "Built from \`$DEV_SHA\`, pushed to \`dev-build\`."
            echo
            echo "Upgrade an existing \`tmb@trustmybot-dev\` install (run from the project root), then restart Claude Code:"
            echo
            echo '```'
            echo 'claude plugin marketplace update trustmybot-dev'
            echo 'claude plugin update tmb@trustmybot-dev --scope local'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the dev build on its PR
        if: ${{ !inputs.dry_run && steps.pr.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_SHA: ${{ steps.push.outputs.build_sha }}
        run: |
          set -uo pipefail
          BODY="$(printf '%s\n' \
            "Dev build \`$VERSION\` is on \`dev-build\` (commit $BUILD_SHA)." \
            '' \
            "Upgrade an existing \`tmb@trustmybot-dev\` install (run from the project root), then restart Claude Code:" \
            '' \
            '```' \
            'claude plugin marketplace update trustmybot-dev' \
            'claude plugin update tmb@trustmybot-dev --scope local' \
            '```')"
          if ! gh pr comment "$PR" --repo "$REPO" --body "$BODY"; then
            echo "::warning::Could not comment dev build $VERSION on PR #$PR; the build itself succeeded."
          fi
