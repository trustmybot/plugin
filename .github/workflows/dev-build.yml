name: dev-build
on:
  # Stamps every dev push as X.Y.Z-dev.<n>.gh<PR> and force-pushes the result to
  # the dev-build branch that the dev marketplace channel serves. Not a gate.
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  stamp:
    name: Stamp and publish dev build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the next release version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LAST_TAG="$(git tag -l 'v[0-9]*' --sort=-v:refname \
                        | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found = 1 }')"
          LAST_TAG="${LAST_TAG:-v0.0.0}"
          LAST="${LAST_TAG#v}"
          NEXT=""
          while IFS= read -r v; do
            [ "$v" != "$LAST" ] || continue
            [ "$(printf '%s\n%s\n' "$LAST" "$v" | sort -V | tail -1)" = "$v" ] || continue
            if [ -z "$NEXT" ] || [ "$(printf '%s\n%s\n' "$NEXT" "$v" | sort -V | head -1)" = "$v" ]; then
              NEXT="$v"
            fi
          done < <(gh api --paginate "repos/$REPO/milestones?state=open" --jq '.[].title' \
                     | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//')
          if [ -z "$NEXT" ]; then
            IFS=. read -r MAJOR MINOR _ <<< "$LAST"
            NEXT="$MAJOR.$((MINOR + 1)).0"
            echo "No open vX.Y.Z milestone above $LAST_TAG; falling back to $NEXT."
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Resolve the PR that produced this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PR="$(gh api "repos/$REPO/commits/$DEV_SHA/pulls" --jq '.[0].number // empty')"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Stamp the version
        id: version
        env:
          NEXT: ${{ steps.next.outputs.next }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          set -euo pipefail
          ARGS=(--next "$NEXT")
          [ -z "$PR" ] || ARGS+=(--pr "$PR")
          VERSION="$(bash scripts/maintenance/dev-build-version.sh "${ARGS[@]}")"
          bash scripts/maintenance/bump-version.sh --version-only "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and push to dev-build
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DEV_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "🔖 chore(dev-build): $VERSION" -m "Built from $DEV_SHA."
          git push --force origin HEAD:refs/heads/dev-build
          echo "build_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          {
            echo "### Dev build \`$VERSION\`"
            echo
            echo "Built from \`$DEV_SHA\`, pushed to \`dev-build\`."
            echo
            echo "Upgrade an existing \`tmb@trustmybot-dev\` install (run from the project root), then restart Claude Code:"
            echo
            echo '```'
            echo 'claude plugin marketplace update trustmybot-dev'
            echo 'claude plugin update tmb@trustmybot-dev --scope local'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the dev build on its PR
        if: steps.pr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pr }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_SHA: ${{ steps.push.outputs.build_sha }}
        run: |
          set -uo pipefail
          BODY="$(printf '%s\n' \
            "Dev build \`$VERSION\` is on \`dev-build\` (commit $BUILD_SHA)." \
            '' \
            "Upgrade an existing \`tmb@trustmybot-dev\` install (run from the project root), then restart Claude Code:" \
            '' \
            '```' \
            'claude plugin marketplace update trustmybot-dev' \
            'claude plugin update tmb@trustmybot-dev --scope local' \
            '```')"
          if ! gh pr comment "$PR" --repo "$REPO" --body "$BODY"; then
            echo "::warning::Could not comment dev build $VERSION on PR #$PR; the build itself succeeded."
          fi
