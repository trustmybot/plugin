name: release-gate
on:
  # Release gate: fires ONLY on rc tags + manual dispatch.
  # The stable tag is functionally identical to the green rc, so it isn't re-gated.
  # Not on dev pushes/PRs — the full gate (incl. L6) is a release-time check.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      skip_l6:
        type: boolean
        default: false
        description: 'Skip the expensive L6 chain (lint/unit/integration/docker still run)'
      l6_from_step:
        type: string
        default: '1'
        description: 'L6 chain --from step (1 = fresh)'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: L1+L2+L3+L4 (+ L6 chain)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # No HF_HOME — model.ts defaults to homedir() + /.cache/huggingface
      # via Node's os.homedir() which resolves to an absolute path. Setting
      # HF_HOME to '~/.cache/huggingface' in YAML produces a literal-tilde
      # string that Node's fs API can't resolve.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2

      - name: Cache HuggingFace ONNX model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-${{ hashFiles('mcp/trajectory-server/src/embeddings/model.ts') }}
          restore-keys: hf-bge-small-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build dist
        run: bun run build

      - name: Fetch bge-small model from CI-assets release (GitHub CDN — avoids HF 429)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          MODEL_DIR="$HOME/.cache/huggingface/Xenova/bge-small-en-v1.5"
          MODEL_FILE="$MODEL_DIR/onnx/model.onnx"
          EXPECTED_SIZE=133093490   # bytes, verified locally 2026-05-22
          mkdir -p "$MODEL_DIR/onnx"
          if [ -f "$MODEL_FILE" ] && [ "$(stat -c%s "$MODEL_FILE" 2>/dev/null || stat -f%z "$MODEL_FILE")" = "$EXPECTED_SIZE" ]; then
            echo "Model already cached with correct size; skipping download."
          else
            # Mirror in the ci-assets-bge-small-en-v1.5 release (Xenova/bge-small-en-v1.5,
            # MIT). GitHub's asset CDN is token-authed and not rate-limited, unlike
            # huggingface.co which 429s GH-Actions runners.
            echo "Downloading model assets from the ci-assets release..."
            gh release download ci-assets-bge-small-en-v1.5 --repo "$GITHUB_REPOSITORY" \
              --pattern model.onnx --dir "$MODEL_DIR/onnx" --clobber
            gh release download ci-assets-bge-small-en-v1.5 --repo "$GITHUB_REPOSITORY" \
              --pattern 'config.json' --pattern 'tokenizer.json' --pattern 'tokenizer_config.json' \
              --dir "$MODEL_DIR" --clobber
            ACTUAL_SIZE=$(stat -c%s "$MODEL_FILE" 2>/dev/null || stat -f%z "$MODEL_FILE")
            echo "Downloaded $ACTUAL_SIZE bytes (expected $EXPECTED_SIZE)"
            if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
              echo "FAIL: model.onnx size mismatch — asset truncated or wrong" >&2
              exit 1
            fi
          fi
          ls -la "$MODEL_DIR" "$MODEL_DIR/onnx"

      - name: Run L1-L4 sweep (run-all.sh)
        run: bash tests/run-all.sh

      - name: Install Claude Code CLI (required by L6 chain runner)
        if: ${{ inputs.skip_l6 != true && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run L6 15-step chain
        if: ${{ inputs.skip_l6 != true && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          L6_FROM_STEP: ${{ inputs.l6_from_step || '1' }}
        run: |
          if [ "$L6_FROM_STEP" = "1" ]; then
            bash tests/l5-l6/run-l6-chain.sh --fresh
          else
            bash tests/l5-l6/run-l6-chain.sh --from "$L6_FROM_STEP"
          fi

      - name: Upload L6 chain artifacts (on success or failure)
        if: ${{ always() && inputs.skip_l6 != true && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v7
        with:
          name: l6-chain-runs-${{ github.run_id }}
          path: ~/.claude/tmb/l6-chain-runs/
          if-no-files-found: warn
          retention-days: 14

  install-smoke:
    name: L0 docker install-smoke
    # L0 docker smoke stays release-only; PR gate is L1–L4 (run-all.sh).
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Run install-smoke
        run: bash tests/l0-install/run-install-smoke.sh
