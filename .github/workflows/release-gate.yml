name: release-gate
on:
  # Release gate, rc/main-only: fires ONLY on rc tags + manual dispatch from rc or main
  # (ref-guard refuses any other ref). The stable tag is functionally identical to the
  # green rc, so it isn't re-gated. Dev merges never wait on it.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  workflow_dispatch:
    inputs:
      skip_l6:
        type: boolean
        default: false
        description: 'Skip the expensive L6 chain (lint/unit/integration/docker still run)'
      l6_from_step:
        type: string
        default: '1'
        description: 'L6 chain --from step (1 = fresh)'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ref-guard:
    name: Refuse refs other than rc/main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Allow rc tags and dispatch from rc or main only
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT:$REF" in
            push:refs/tags/v*-rc.*|workflow_dispatch:refs/heads/rc|workflow_dispatch:refs/heads/main)
              echo "release-gate allowed for $EVENT on $REF."
              ;;
            *)
              echo "::error::release-gate is rc/main-only and refuses $EVENT on $REF. Dispatch it from rc instead: gh workflow run release-gate.yml --ref rc (see CONTRIBUTING, Release Phase B)."
              exit 1
              ;;
          esac

  verdict-check:
    name: Same-SHA verdict check
    needs: ref-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      short_circuit: ${{ steps.check.outputs.short_circuit }}
    steps:
      - name: Inherit a green same-SHA dispatch verdict (tag events only)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "event=${{ github.event_name }} — dispatch runs the full gate, never inherits."
            echo "short_circuit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.sha }}"
          CUTOFF=$(date -u -d '48 hours ago' +%s 2>/dev/null || date -u -v-48H +%s)
          HIT=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-gate.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"$SHA\" and .conclusion == \"success\" and (.created_at | fromdateiso8601) >= $CUTOFF) | .id] | first // empty")
          if [ -n "$HIT" ]; then
            echo "short_circuit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::verdict inherited from run $HIT (same SHA)"
            echo "Inheriting green dispatch verdict from run $HIT for $SHA — heavy jobs will skip."
          else
            echo "short_circuit=false" >> "$GITHUB_OUTPUT"
            echo "No green same-SHA dispatch verdict within 48h; running the full gate."
          fi

  tests:
    name: L1+L2+L3+L4 (+ L6 chain)
    needs: verdict-check
    if: ${{ needs.verdict-check.outputs.short_circuit != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # No HF_HOME — model.ts defaults to homedir() + /.cache/huggingface
      # via Node's os.homedir() which resolves to an absolute path. Setting
      # HF_HOME to '~/.cache/huggingface' in YAML produces a literal-tilde
      # string that Node's fs API can't resolve.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          (cd dashboard && bun install --frozen-lockfile)

      - name: Build the generated payload
        run: bun run build:payload

      - uses: ./.github/actions/fetch-bge-model

      - name: Run L1-L4 sweep (run-all.ts)
        run: node --experimental-strip-types tests/run-all.ts

      - name: Install Claude Code CLI (required by L6 chain runner)
        if: ${{ inputs.skip_l6 != true && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run L6 15-step chain
        if: ${{ inputs.skip_l6 != true && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        env:
          L6_FROM_STEP: ${{ inputs.l6_from_step || '1' }}
        run: |
          if [ "$L6_FROM_STEP" = "1" ]; then
            node --experimental-strip-types --experimental-sqlite tests/l5-l6/run-l6-chain.ts --fresh
          else
            node --experimental-strip-types --experimental-sqlite tests/l5-l6/run-l6-chain.ts --from "$L6_FROM_STEP"
          fi

      - name: Upload L6 chain artifacts (on success or failure)
        if: ${{ always() && inputs.skip_l6 != true && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
        uses: actions/upload-artifact@v7
        with:
          name: l6-chain-runs-${{ github.run_id }}
          path: ${{ github.workspace }}/.claude/tmb/l6-chain-runs/
          if-no-files-found: warn
          retention-days: 14

  sandbox-probe:
    name: macOS Bash sandbox network probe
    # Fails when a command that passes on the host fails under /onboard's
    # sandbox block and isn't in the recorded SANDBOX_NETWORK_PROBE (GH 1549).
    needs: verdict-check
    if: ${{ needs.verdict-check.outputs.short_circuit != 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install deps
        run: |
          bun install --frozen-lockfile
          (cd dashboard && bun install --frozen-lockfile)

      - name: Build the generated payload
        run: bun run build:payload

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run sandbox network probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types tests/l5-l6/probes/sandbox-network-probe.ts --check-recorded

  install-smoke:
    name: L0 install-smoke (${{ matrix.os }})
    # L0 is the installation test layer: contributors run it locally before a PR;
    # release-gate also runs it on rc tags and dispatch. Linux runs the driver
    # inside the Docker image; macOS and Windows run it host-native (GH 1749).
    needs: verdict-check
    if: ${{ needs.verdict-check.outputs.short_circuit != 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run install-smoke in Docker
        if: matrix.os == 'ubuntu-latest'
        run: node --experimental-strip-types tests/l0-install/run-docker.ts install

      - uses: oven-sh/setup-bun@v2
        if: matrix.os != 'ubuntu-latest'
        with:
          bun-version-file: .bun-version

      - name: Install Claude Code CLI
        if: matrix.os != 'ubuntu-latest'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run install-smoke host-native
        if: matrix.os != 'ubuntu-latest'
        run: node --experimental-strip-types tests/l0-install/install-smoke.ts
